name: Build IPAs (iOS & watchOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    name: Build & Package IPAs
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Run Core Unit Tests
        run: |
          swift test --package-path StayTrackCore

      - name: Build and Package IPAs
        run: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh "${{ inputs.configuration || 'Release' }}"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StayTrack-iOS-IPA
          path: build/ipa/StayTrack.ipa
          retention-days: 14

      - name: Upload watchOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StayTrack-watchOS-IPA
          path: build/ipa/StayTrackWatch.ipa
          retention-days: 14

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ipa/StayTrack.ipa
            build/ipa/StayTrackWatch.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
